
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>A Little Gift for Donia ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap">
    <style>


html { color-scheme: light; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(
        135deg,
        #fff8f5,
        #fce9e8,
        #fff5f0
    );

    font-family: 'Quicksand', sans-serif;
    overflow-x: hidden;
    padding: 25px 12px;
}

.card {
    position: relative;
    width: 100%;
    max-width: 600px;

    text-align: center;
    padding: 35px 15px;

    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 30px;

    box-shadow: 0 15px 45px rgba(185, 125, 125, 0.12);

    animation: appear 1.2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.top-decoration {
    color: #d89a9b;
    font-size: 30px;
    margin-bottom: 10px;
}

.small-title {
    color: #bc9292;
    font-size: 10px;
    letter-spacing: 4px;
    font-weight: 600;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 500;
    color: #ad777b;
    margin-top: 12px;
}

.subtitle {
    color: #b99b99;
    font-size: 13px;
    margin-top: 8px;
}

.heart-container {
    margin: 15px auto 0;
    max-width: 420px;
    width: 100%;

    animation: softBeat 3s ease-in-out infinite;
}

#heartCanvas {
    display: block;
    width: 100%;
    height: auto;
}

@keyframes softBeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.025);
    }
}

.flower {
    font-size: 48px;
    margin-top: -5px;

    animation: flowerFloat 4s ease-in-out infinite;
}

@keyframes flowerFloat {
    0%, 100% {
        transform: translateY(0) rotate(-3deg);
    }

    50% {
        transform: translateY(-8px) rotate(3deg);
    }
}

h2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 25px;
    font-weight: 500;
    color: #b77d83;
    margin-top: 8px;
}

.message {
    color: #a99191;
    font-size: 13px;
    line-height: 1.9;
    margin-top: 13px;
}

.bottom-decoration {
    margin-top: 25px;
    color: #c18d91;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
}

.floating-heart {
    position: fixed;
    color: #dba9a9;
    opacity: 0.4;
    pointer-events: none;

    animation: floatHeart 6s ease-in-out infinite;
}

.heart-one {
    top: 12%;
    left: 12%;
    font-size: 35px;
}

.heart-two {
    top: 70%;
    right: 12%;
    font-size: 45px;
    animation-delay: 2s;
}

.heart-three {
    bottom: 10%;
    left: 20%;
    font-size: 25px;
    animation-delay: 3s;
}

@keyframes floatHeart {
    0%, 100% {
        transform: translateY(0);
        opacity: 0.25;
    }

    50% {
        transform: translateY(-20px);
        opacity: 0.65;
    }
}

@media (max-width: 500px) {
    h1 {
        font-size: 38px;
    }

    h2 {
        font-size: 21px;
    }

    .card {
        padding: 30px 10px;
    }
}

    </style>
</head>

<body>

    <div class="floating-heart heart-one">♡</div>
    <div class="floating-heart heart-two">♡</div>
    <div class="floating-heart heart-three">♡</div>

    <main class="card">

        <div class="top-decoration">✿</div>

        <p class="small-title">A LITTLE GIFT FOR YOU</p>

        <h1>For Donia</h1>

        <p class="subtitle">Someone who makes life sweeter ♡</p>

        <div class="heart-container">
            <canvas id="heartCanvas"></canvas>
        </div>

        <div class="flower">🌷</div>

        <h2>Donia is my bestie</h2>

        <p class="message">
            Just a little reminder<br>
            that you’re someone special.
        </p>

        <div class="bottom-decoration">
            With love, always ♡
        </div>

    </main>

    <script>

const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

const message = "Donia is my bestie  ♡  ";

function drawHeart() {

    const width = 440;
    const height = 390;

    const dpr = window.devicePixelRatio || 1;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.clearRect(0, 0, width, height);

    // Create heart shape
    const heart = new Path2D();

    heart.moveTo(220, 345);

    heart.bezierCurveTo(
        180, 315,
        35, 220,
        35, 130
    );

    heart.bezierCurveTo(
        35, 35,
        150, 25,
        220, 105
    );

    heart.bezierCurveTo(
        290, 25,
        405, 35,
        405, 130
    );

    heart.bezierCurveTo(
        405, 220,
        260, 315,
        220, 345
    );

    heart.closePath();

    // Clip text inside heart
    ctx.save();
    ctx.clip(heart);

    // Elegant pink text
    ctx.fillStyle = "#c47f89";
    ctx.font = "600 12px Georgia";
    ctx.textBaseline = "middle";

    // Fill heart with repeated message
    let row = 0;

    for (let y = 55; y < 350; y += 17) {

        const offset = row % 2 === 0 ? 0 : -40;

        for (let x = -100 + offset; x < 550; x += 125) {

            ctx.fillText(message, x, y);

        }

        row++;
    }

    ctx.restore();

    // Delicate heart outline
    ctx.strokeStyle = "rgba(196, 127, 137, 0.25)";
    ctx.lineWidth = 1.5;
    ctx.stroke(heart);
}

// Draw heart
drawHeart();

// Redraw when window changes
window.addEventListener("resize", drawHeart);

</script>

</body>
</html>
